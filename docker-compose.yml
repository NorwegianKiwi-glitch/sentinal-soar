name: sentinal-soar

services:
  app:
    build: .
    image: ghcr.io/norwegiankiwi-glitch/sentinal-soar-app:latest
    restart: unless-stopped
    ports:
      - "6767:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://soar_admin:${POSTGRES_PASSWORD}@db:5432/soar_governance
      # Discord is optional — leave these unset to run the web console alone.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      # Cloudflare access traffic is optional — leave unset to skip polling.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_HOSTNAMES: ${CLOUDFLARE_HOSTNAMES:-}
      CLOUDFLARE_POLL_MINUTES: ${CLOUDFLARE_POLL_MINUTES:-5}
    volumes:
      # Grants the container full control of the host's Docker daemon — see
      # "Known limitations" in ARCHITECTURE.md before exposing this beyond your LAN.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mounted at the identical host path so the compose-label file paths on
      # containers resolve as-is; lets Sentinal rewrite a CasaOS app's image
      # tag after patching it, so the UI matches reality and a CasaOS
      # re-apply can't roll the patch back.
      - /var/lib/casaos/apps:/var/lib/casaos/apps
      # Pre-upgrade backups: the host's backup script runs inside this
      # container (docker CLI + restic ship in the image) against the same
      # repository and identical host paths as manual runs — see BACKUPS.md.
      - /usr/local/bin/sentinal-backup.sh:/usr/local/bin/sentinal-backup.sh:ro
      - /root/.config/sentinal-backup:/root/.config/sentinal-backup:ro
      - /DATA/AppData:/DATA/AppData:ro
      - /DATA/Backups:/DATA/Backups
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      # Use the host's timezone so a "daily at HH:MM" scan means the Pi's local
      # time, not UTC (all stored timestamps stay UTC regardless).
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soar_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soar_governance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soar_admin -d soar_governance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

x-casaos:
  id: io.github.norwegiankiwi.sentinal-soar
  main: app
  index: /
  port_map: "6767"
  scheme: http
  title:
    en_us: Sentinal SOAR
  tagline:
    en_us: Container vulnerability scanning with human-in-the-loop remediation
  description:
    en_us: Scans running containers with Trivy, explains findings with Gemini, and asks for a patch/snooze/refuse decision over Discord before acting.
  author: NorwegianKiwi-glitch
  developer: NorwegianKiwi-glitch
  category: Utilities
  architectures:
    - amd64
    - arm64
