<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sentinal{% endblock %} — Sentinal</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: Canvas; color: CanvasText; }
    header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem 2rem;
             border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    header h1 { font-size: 1.2rem; margin: 0; }
    nav { display: flex; gap: .25rem; }
    nav a { text-decoration: none; color: inherit; padding: .35rem .7rem; border-radius: 6px; font-size: .9rem; }
    nav a.active { background: color-mix(in srgb, CanvasText 12%, transparent); font-weight: 600; }
    .scan-control { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
    .btn { cursor: pointer; font: inherit; padding: .4rem .9rem; border-radius: 6px; border: 1px solid #1c7a82;
           background: #1c7a82; color: white; font-weight: 600; text-decoration: none; display: inline-block; }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.stop { background: #b0334a; border-color: #b0334a; }
    main { padding: 1.5rem 2rem; max-width: 1100px; }
    h2 { margin-top: 0; }
    .muted { color: GrayText; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
    .badge.PATCHED, .badge.MAJOR_UPGRADED { background: #15734c2b; color: #1a9c68; }
    .badge.SNOOZED { background: #b4700a2b; color: #d38f1d; }
    .badge.REFUSED, .badge.FAILED { background: #b0334a2b; color: #e0587a; }
    .badge.CLEAN, .badge.AUTO_SKIP { background: #4b55632b; color: #8b93a1; }
    table { width: 100%; border-collapse: collapse; margin: .5rem 0 2rem; }
    th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
             font-size: .85rem; vertical-align: top; }
    th { text-transform: uppercase; font-size: .68rem; letter-spacing: .05em; color: GrayText; }
    input, select { font: inherit; padding: .35rem .5rem; border-radius: 6px;
                    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit; }
    .row-btn { font-size: .75rem; padding: .3rem .6rem; border-radius: 5px; cursor: pointer;
               border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
    pre { white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 640px) { header, main { padding-left: 1rem; padding-right: 1rem; } .scan-control { margin-left: 0; } }
  </style>
</head>
<body>
  <header>
    <h1>🛡 Sentinal</h1>
    <nav>
      <a href="{{ url_for('dashboard.decisions') }}" class="{{ 'active' if active == 'decisions' }}">Decisions</a>
      <a href="{{ url_for('dashboard.logs') }}" class="{{ 'active' if active == 'logs' }}">Scan Log</a>
      <a href="{{ url_for('dashboard.exceptions') }}" class="{{ 'active' if active == 'exceptions' }}">Exceptions</a>
    </nav>
    <div class="scan-control">
      <span id="scan-state" class="muted"></span>
      <button id="scan-run" class="btn">Run scan</button>
      <button id="scan-stop" class="btn stop" style="display:none">Stop scan</button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    const scanRun = document.getElementById('scan-run');
    const scanStop = document.getElementById('scan-stop');
    const scanState = document.getElementById('scan-state');
    let wasRunning = false;
    async function refreshScan() {
      try {
        const d = await (await fetch('/api/scan/status')).json();
        scanRun.style.display = d.running ? 'none' : '';
        scanStop.style.display = d.running ? '' : 'none';
        scanState.textContent = d.running ? 'scanning…' : '';
        if (wasRunning && !d.running) { location.reload(); }
        wasRunning = d.running;
      } catch (e) {}
    }
    scanRun.onclick = async () => { scanRun.disabled = true; await fetch('/api/scan', { method: 'POST' }); scanRun.disabled = false; refreshScan(); };
    scanStop.onclick = async () => { scanStop.disabled = true; await fetch('/api/scan/stop', { method: 'POST' }); scanStop.disabled = false; };
    setInterval(refreshScan, 3000); refreshScan();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
